<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active NOTAMs</title>
  <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        box-sizing: border-box;
    }

    .notam-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 10px 14px;
        box-sizing: border-box;
        justify-content: space-between;
    }

    .notam-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #94a3b8;
        border-bottom: 1px solid #334155;
        padding-bottom: 4px;
        flex-shrink: 0;
    }

    .notam-count {
        background-color: #334155;
        color: #38bdf8;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 11px;
    }

    .notam-body {
        flex: 1;
        display: flex;
        align-items: center;
        overflow: hidden;
        position: relative;
        min-height: 0;
    }

    .text-scroll-wrapper {
        width: 100%;
        overflow: hidden;
        position: relative;
    }

    .marquee-track {
        display: block;
        width: 100%;
        will-change: transform;
    }

    .marquee-track.running {
        display: inline-flex;
        white-space: nowrap;
        animation: marquee-loop 16s linear infinite;
    }

    @keyframes marquee-loop {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    .plain-text {
        font-size: 21px !important;
        font-weight: 800;
        color: #f8fafc;
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: normal !important;
    }

    .notam-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: #64748b;
        border-top: 1px solid #1e293b;
        padding-top: 4px;
        flex-shrink: 0;
    }

    .notam-nav-btn {
        background: #1e293b;
        border: 1px solid #334155;
        color: #94a3b8;
        padding: 2px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
    }

    .notam-nav-btn:hover {
        background: #334155;
        color: #f8fafc;
    }
  </style>
 </head>
 <body>
  <div class="notam-container">
   <div class="notam-header">
    <span>Active NOTAMs</span>
    <span id="notam-counter" class="notam-count">0 / 0</span>
   </div>

   <div class="notam-body">
    <div class="text-scroll-wrapper" id="scroll-wrapper">
     <div class="marquee-track" id="marquee-track">
      <div class="plain-text" id="notam-text">Awaiting NOTAM data...</div>
     </div>
    </div>
   </div>

   <div class="notam-footer">
    <button class="notam-nav-btn" id="prev-btn">&larr; Prev</button>
    <span id="notam-id-display">--</span>
    <button class="notam-nav-btn" id="next-btn">Next &rarr;</button>
   </div>
  </div>

  <script>
    var notamList = [];
    var currentIndex = 0;
    var cycleTimer = null;
    const CYCLE_MS = 15000; // Time per NOTAM if not interacting

    function setupMarquee(track) {
        if (!track) return;
        var wrapper = track.parentElement;
        var firstSpan = track.querySelector('.plain-text');
        if (!firstSpan) return;

        var spans = track.querySelectorAll('.plain-text');
        for (var i = 1; i < spans.length; i++) {
            spans[i].remove();
        }
        track.classList.remove('running');
        track.style.animationDuration = '';

        // Temporarily reset to single-line natural width to check true text length
        firstSpan.style.display = 'inline-block';
        firstSpan.style.webkitLineClamp = 'unset';
        firstSpan.style.whiteSpace = 'nowrap';
        
        var fullWidth = firstSpan.offsetWidth;

        if (fullWidth > wrapper.clientWidth) {
            // Text is too long to fit, keep it single-line and run marquee
            firstSpan.style.paddingRight = '60px';
            var clone = firstSpan.cloneNode(true);
            track.appendChild(clone);

            var duration = Math.max(10, Math.round(fullWidth / 45));
            track.style.animationDuration = duration + 's';
            track.classList.add('running');
        } else {
            // Text fits on two lines or less, enforce 2-line wrapping
            firstSpan.style.paddingRight = '0';
            firstSpan.style.display = '-webkit-box';
            firstSpan.style.webkitLineClamp = '2';
            firstSpan.style.whiteSpace = 'normal';
        }
    }

    function renderCurrentNotam() {
        const textEl = document.getElementById('notam-text');
        const counterEl = document.getElementById('notam-counter');
        const idDisplay = document.getElementById('notam-id-display');
        const track = document.getElementById('marquee-track');

        if (!notamList || notamList.length === 0) {
            textEl.innerText = "No active NOTAMs.";
            counterEl.innerText = "0 / 0";
            idDisplay.innerText = "--";
            setupMarquee(track);
            return;
        }

        if (currentIndex >= notamList.length) currentIndex = 0;
        if (currentIndex < 0) currentIndex = notamList.length - 1;

        const current = notamList[currentIndex];
        // Support different payload schemas (e.g., text, message, or id/body)
        const displayText = current.text || current.message || current.body || JSON.stringify(current);
        const displayId = current.id || current.notamId || ('NOTAM ' + (currentIndex + 1));

        textEl.innerText = displayText;
        counterEl.innerText = (currentIndex + 1) + ' / ' + notamList.length;
        idDisplay.innerText = displayId;

        setupMarquee(track);
    }

    function startAutoCycle() {
        if (cycleTimer) clearInterval(cycleTimer);
        cycleTimer = setInterval(function () {
            if (notamList.length > 1) {
                currentIndex = (currentIndex + 1) % notamList.length;
                renderCurrentNotam();
            }
        }, CYCLE_MS);
    }

    document.getElementById('next-btn').addEventListener('click', function () {
        if (notamList.length > 1) {
            currentIndex = (currentIndex + 1) % notamList.length;
            renderCurrentNotam();
            startAutoCycle();
        }
    });

    document.getElementById('prev-btn').addEventListener('click', function () {
        if (notamList.length > 1) {
            currentIndex = (currentIndex - 1 + notamList.length) % notamList.length;
            renderCurrentNotam();
            startAutoCycle();
        }
    });

    window.addEventListener('message', function (event) {
        if (!event.data) return;
        if (event.data.type === 'NOTAM_DATA') {
            var payload = event.data.payload;
            if (Array.isArray(payload)) {
                notamList = payload;
            } else if (payload && Array.isArray(payload.notams)) {
                notamList = payload.notams;
            } else if (payload) {
                notamList = [payload];
            } else {
                notamList = [];
            }
            currentIndex = 0;
            renderCurrentNotam();
            startAutoCycle();
        }
    });

    // Notify parent frame that this child iframe is ready to receive data
    window.addEventListener('DOMContentLoaded', function () {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'NOTAM_READY' }, '*');
        }
    });
  </script>
 </body>
</html>
