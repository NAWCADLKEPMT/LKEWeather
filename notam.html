<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e9ecef;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            color: #111827;
        }

        .notam-shell {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background: #e9ecef;
            min-height: 0;
        }

        .notam-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 4px 12px;
            background: #d1d5db;
            border-bottom: 2px solid #9ca3af;
            flex-shrink: 0;
            min-height: 34px;
            box-sizing: border-box;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1 1 auto;
        }

        .notam-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #f59e0b;
            color: #1c1917;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 4px;
            line-height: 1.2;
            flex-shrink: 0;
        }

        .location-chip {
            font-size: 17px;
            font-weight: 900;
            color: #1f2937;
            letter-spacing: 0.8px;
            flex-shrink: 0;
        }

        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 0 0 auto;
        }

        .counter {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #1f2937;
            white-space: nowrap;
        }

        .dot-row {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9ca3af;
            border: 1px solid #6b7280;
            transition: background 0.25s, transform 0.25s, border-color 0.25s;
        }
        .dot.current {
            background: #d97706;
            border-color: #b45309;
            transform: scale(1.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex: 1 1 auto;
            min-width: 0;
        }

        .fetched-label {
            font-size: 13px;
            font-weight: 700;
            color: #4b5563;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .progress-track {
            height: 3px;
            background: #cbd5e1;
            flex-shrink: 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            transform: scaleX(0);
            transform-origin: left center;
        }
        .progress-fill.running {
            animation: notam-progress linear forwards;
        }
        @keyframes notam-progress {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }

        .table-wrap {
            flex: 1 1 0;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0;
            box-sizing: border-box;
        }

        .notam-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            opacity: 1;
            transition: opacity 0.28s ease;
            box-sizing: border-box;
        }
        .notam-table.fade {
            opacity: 0;
        }

        .notam-table th {
            background: #d1d5db;
            color: #374151;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            text-align: left;
            padding: 3px 10px;
            border-bottom: 2px solid #adb5bd;
            white-space: nowrap;
            height: 24px;
            box-sizing: border-box;
        }

        .notam-table tbody tr {
            height: 33.333%;
            border-bottom: 1px solid #cbd5e1;
            box-sizing: border-box;
        }
        .notam-table tbody tr:last-child {
            border-bottom: none;
        }
        .notam-table tbody tr.item-row:nth-child(even) {
            background-color: #f1f5f9;
        }
        .notam-table tbody tr.empty-filler-row {
            background-color: transparent;
        }

        .notam-table td {
            vertical-align: middle;
            padding: 3px 10px;
            box-sizing: border-box;
        }

        /* Column widths */
        .col-id    { width: 11%; }
        .col-start { width: 14%; }
        .col-end   { width: 14%; }
        
        .col-text { 
            width: 61%; 
            padding: 3px 12px !important;
            height: 100%;
        }

        .id-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: flex-start;
        }
        .notam-num {
            font-size: 17px;
            font-weight: 900;
            color: #0f172a;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .status-chip {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.7px;
            padding: 1px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            display: inline-block;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .status-active {
            background: #15803d;
            color: #ffffff;
            border: 1px solid #166534;
        }
        .status-scheduled {
            background: #0369a1;
            color: #ffffff;
            border: 1px solid #075985;
        }

        .when-cell {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .when-date-time {
            font-size: 16px;
            font-weight: 900;
            color: #0f172a;
            white-space: nowrap;
        }
        .when-time-part {
            color: #0369a1;
            font-weight: 800;
            margin-left: 3px;
        }
        .when-sched {
            font-size: 11px;
            font-weight: 700;
            color: #b45309;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .text-scroll-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            padding: 0;
        }

        .marquee-track {
            display: flex;
            align-items: center;
            width: 100%;
            will-change: transform;
            --pause-percent: 0%;
        }

        .marquee-track.running {
            width: max-content;
            animation: marquee-loop linear infinite;
        }

        @keyframes marquee-loop {
            0% { 
                transform: translateX(0); 
            }
            var(--pause-percent, 0%) {
                transform: translateX(0);
            }
            100% { 
                transform: translateX(-50%); 
            }
        }

        .plain-text {
            font-size: 18px !important;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            flex-shrink: 0;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .marquee-mode .plain-text {
            font-size: 18px !important;
            display: inline-block !important;
            white-space: nowrap !important;
            width: auto !important;
            -webkit-line-clamp: unset !important;
            overflow: visible !important;
            padding-right: 60px !important;
        }

        /* States */
        .empty-state, .error-state, .loading-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px;
            text-align: center;
        }
        .empty-title {
            font-size: 18px;
            font-weight: 900;
            color: #15803d;
            letter-spacing: 0.4px;
        }
        .empty-sub {
            font-size: 13px;
            font-weight: 700;
            color: #4b5563;
        }
        .error-title {
            font-size: 18px;
            font-weight: 900;
            color: #b91c1c;
        }
        .loading-title {
            font-size: 16px;
            font-weight: 800;
            color: #4b5563;
        }

        @media screen and (max-width: 1100px), screen and (max-aspect-ratio: 1/1), (orientation: portrait) {
            .notam-header { padding: 3px 6px; gap: 4px; min-height: 30px; }
            .notam-badge { font-size: 11px; padding: 1px 5px; }
            .location-chip { font-size: 14px; }
            .counter { font-size: 12px; }
            .fetched-label { font-size: 11px; }
            .notam-table th { font-size: 10px; padding: 2px 6px; }
            .notam-table td { padding: 2px 6px; }
            .notam-table td.col-text { padding: 2px 6px !important; }
            .notam-num { font-size: 14px; }
            .when-date-time { font-size: 13px; }
            .plain-text { font-size: 14px !important; }
