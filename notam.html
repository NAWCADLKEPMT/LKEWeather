<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        :root {
            --panel-header-h: 32px;
            --progress-h: 3px;
            --table-header-h: 22px;

            --row-h: 66px;
            --row-gap-border: 1px;
            --rows-visible: 3;

            --table-body-h: calc((var(--row-h) * var(--rows-visible)) + (var(--row-gap-border) * 2));
            --table-area-h: calc(var(--table-header-h) + var(--table-body-h));

            --text-box-h: 32px;

            --shell-bg: #e9ecef;
            --header-bg: #d1d5db;
            --border-mid: #9ca3af;
            --border-light: #cbd5e1;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--shell-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            color: #111827;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        .notam-shell {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--shell-bg);
            min-height: 0;
            overflow: hidden;
        }

        .notam-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 3px 10px;
            background: var(--header-bg);
            border-bottom: 2px solid var(--border-mid);
            flex: 0 0 var(--panel-header-h);
            min-height: var(--panel-header-h);
            max-height: var(--panel-header-h);
            overflow: hidden;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1 1 auto;
        }

        .notam-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #f59e0b;
            color: #1c1917;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 2px 7px;
            border-radius: 4px;
            line-height: 1.1;
            flex-shrink: 0;
        }

        .location-chip {
            font-size: 16px;
            font-weight: 900;
            color: #1f2937;
            letter-spacing: 0.8px;
            flex-shrink: 0;
        }

        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 0 0 auto;
        }

        .counter {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.4px;
            color: #1f2937;
            white-space: nowrap;
            line-height: 1;
        }

        .dot-row {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9ca3af;
            border: 1px solid #6b7280;
            transition: background 0.25s, transform 0.25s, border-color 0.25s;
        }

        .dot.current {
            background: #d97706;
            border-color: #b45309;
            transform: scale(1.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex: 1 1 auto;
            min-width: 0;
        }

        .fetched-label {
            font-size: 12px;
            font-weight: 700;
            color: #4b5563;
            letter-spacing: 0.2px;
            white-space: nowrap;
            line-height: 1;
        }

        .progress-track {
            height: var(--progress-h);
            background: #cbd5e1;
            flex: 0 0 var(--progress-h);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            transform: scaleX(0);
            transform-origin: left center;
        }

        .progress-fill.running {
            animation: notam-progress linear forwards;
        }

        @keyframes notam-progress {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }

        .table-wrap {
            flex: 0 0 var(--table-area-h);
            min-height: var(--table-area-h);
            max-height: var(--table-area-h);
            height: var(--table-area-h);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        .notam-table {
            width: 100%;
            height: var(--table-area-h);
            border-collapse: collapse;
            table-layout: fixed;
            opacity: 1;
            transition: opacity 0.28s ease;
        }

        .notam-table.fade {
            opacity: 0;
        }

        .notam-table thead,
        .notam-table thead tr {
            height: var(--table-header-h);
            min-height: var(--table-header-h);
            max-height: var(--table-header-h);
        }

        .notam-table th {
            background: var(--header-bg);
            color: #374151;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            text-align: left;
            padding: 2px 8px;
            border-bottom: 2px solid #adb5bd;
            white-space: nowrap;
            height: var(--table-header-h);
            min-height: var(--table-header-h);
            max-height: var(--table-header-h);
            overflow: hidden;
            line-height: 1;
        }

        .notam-table tbody {
            height: var(--table-body-h);
            min-height: var(--table-body-h);
            max-height: var(--table-body-h);
        }

        .notam-table tbody tr {
            height: var(--row-h);
            min-height: var(--row-h);
            max-height: var(--row-h);
            border-bottom: 1px solid var(--border-light);
        }

        .notam-table tbody tr:last-child {
            border-bottom: none;
        }

        .notam-table tbody tr.item-row:nth-child(even) {
            background-color: #f1f5f9;
        }

        .notam-table tbody tr.empty-filler-row {
            background-color: transparent;
        }

        .notam-table td {
            vertical-align: middle;
            padding: 2px 8px;
            height: var(--row-h);
            min-height: var(--row-h);
            max-height: var(--row-h);
            overflow: hidden;
        }

        .col-id    { width: 11%; }
        .col-start { width: 14%; }
        .col-end   { width: 14%; }
        .col-text  { width: 61%; padding: 2px 10px !important; }

        .id-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: flex-start;
            justify-content: center;
            height: 100%;
            overflow: hidden;
        }

        .notam-num {
            font-size: 15px;
            font-weight: 900;
            color: #0f172a;
            white-space: nowrap;
            letter-spacing: 0.2px;
            line-height: 1.05;
        }

        .status-chip {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.6px;
            padding: 1px 5px;
            border-radius: 3px;
            text-transform: uppercase;
            display: inline-block;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            line-height: 1.1;
        }

        .status-active {
            background: #15803d;
            color: #ffffff;
            border: 1px solid #166534;
        }

        .status-scheduled {
            background: #0369a1;
            color: #ffffff;
            border: 1px solid #075985;
        }

        .when-cell {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1px;
            height: 100%;
            overflow: hidden;
        }

        .when-date-time {
            font-size: 14px;
            font-weight: 900;
            color: #0f172a;
            white-space: nowrap;
            line-height: 1.05;
        }

        .when-time-part {
            color: #0369a1;
            font-weight: 800;
            margin-left: 3px;
        }

        .when-sched {
            font-size: 10px;
            font-weight: 700;
            color: #b45309;
            line-height: 1.05;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .text-scroll-wrapper {
            width: 100%;
            height: var(--text-box-h);
            min-height: var(--text-box-h);
            max-height: var(--text-box-h);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0;
        }

        .marquee-track {
            display: flex;
            align-items: center;
            width: 100%;
            height: var(--text-box-h);
            min-height: var(--text-box-h);
            max-height: var(--text-box-h);
            will-change: transform;
        }

        .marquee-track.running {
            width: max-content;
            animation: marquee-loop linear infinite;
            animation-delay: 1.5s;
            animation-fill-mode: backwards;
        }

        @keyframes marquee-loop {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .plain-text {
            font-size: 16px !important;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            flex-shrink: 0;
            width: 100%;
            margin: 0;
            padding: 0;
            max-height: calc(2 * 1.2em);
        }

        .marquee-mode .plain-text {
            font-size: 16px !important;
            display: inline-block !important;
            white-space: nowrap !important;
            width: auto !important;
            -webkit-line-clamp: unset !important;
            overflow: visible !important;
            padding-right: 60px !important;
            line-height: var(--text-box-h) !important;
        }

        .empty-state, .error-state, .loading-state {
            width: 100%;
            height: var(--table-area-h);
            min-height: var(--table-area-h);
            max-height: var(--table-area-h);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px;
            text-align: center;
            overflow: hidden;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 900;
            color: #15803d;
            letter-spacing: 0.4px;
        }

        .empty-sub {
            font-size: 13px;
            font-weight: 700;
            color: #4b5563;
        }

        .error-title {
            font-size: 18px;
            font-weight: 900;
            color: #b91c1c;
        }

        .loading-title {
            font-size: 16px;
            font-weight: 800;
            color: #4b5563;
        }

        @media screen and (max-width: 1100px), screen and (max-aspect-ratio: 1/1), (orientation: portrait) {
            :root {
                --panel-header-h: 28px;
                --table-header-h: 20px;
                --row-h: 58px;
                --text-box-h: 28px;
            }

            .notam-header { padding: 2px 6px; gap: 4px; }
            .notam-badge { font-size: 10px; padding: 1px 4px; }
            .location-chip { font-size: 13px; }
            .counter { font-size: 11px; }
            .fetched-label { font-size: 10px; }
            .notam-table th { font-size: 9px; padding: 2px 5px; }
            .notam-table td { padding: 2px 5px; }
            .col-text { padding: 2px 5px !important; }
            .notam-num { font-size: 13px; }
            .when-date-time { font-size: 12px; }
            .when-sched { font-size: 9px; }
            .plain-text { font-size: 13px !important; }
            .marquee-mode .plain-text { font-size: 13px !important; }

            .col-id { width: 14%; }
            .col-start { width: 17%; }
            .col-end { width: 17%; }
            .col-text { width: 52%; }
        }
    </style>
</head>
<body>
<div class="notam-shell" id="shell">
    <div class="notam-header">
        <div class="header-left">
            <span class="notam-badge">NOTAM</span>
            <span class="location-chip" id="val-location">KNEL</span>
        </div>
        <div class="header-center">
            <div class="counter" id="val-counter">PAGE 0 / 0</div>
            <div class="dot-row" id="dot-row"></div>
        </div>
        <div class="header-right">
            <span class="fetched-label" id="val-fetched">Waiting for data…</span>
        </div>
    </div>

    <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="table-wrap" id="table-wrap">
        <div class="loading-state">
            <div class="loading-title">Loading active NOTAMs…</div>
        </div>
    </div>
</div>

<script>
    var PAGE_SIZE = 3;
    var DEFAULT_ROTATE_MS = 20000;
    var INITIAL_PAUSE_MS = 1500;
    var notams = [];
    var currentPage = 0;
    var rotateTimer = null;
    var fadeTimer = null;
    var lastPayloadOk = false;
    var fetchedAtIso = null;
    var locationCode = 'KNEL';

    window.addEventListener('message', function (event) {
        if (!event.data) return;
        if (event.data.type === 'NOTAM_DATA') {
            handlePayload(event.data.payload);
        }
    });

    function notifyParent(type) {
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: type }, '*');
            }
        } catch (e) {}
    }

    function hasDisplayableData() {
        return lastPayloadOk || notams.length > 0;
    }

    function formatEasternTime(iso) {
        if (!iso) return { date: 'PERM', time: '', raw: 'PERM' };
        var d = new Date(iso);
        if (isNaN(d.getTime())) return { date: '--', time: '', raw: '--' };

        try {
            var dateStr = d.toLocaleDateString('en-US', {
                timeZone: 'America/New_York',
                day: '2-digit',
                month: 'short'
            });

            var timeStr = d.toLocaleTimeString('en-US', {
                timeZone: 'America/New_York',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });

            return { date: dateStr, time: timeStr, raw: dateStr + ' ' + timeStr };
        } catch (e) {
            return { date: 'Error', time: '', raw: '' };
        }
    }

    function formatFetched(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        try {
            return 'Updated ' + d.toLocaleTimeString('en-US', {
                timeZone: 'America/New_York',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            }) + ' ET';
        } catch (e) {
            return 'Updated ' + d.getHours() + ':' + d.getMinutes();
        }
    }

    function formatSchedule(raw) {
        if (!raw) return '';
        var s = String(raw);
        var tilde = s.indexOf('~');
        if (tilde !== -1) s = s.substring(tilde + 1);
        s = s.replace(/^Daily:/i, 'Daily ').replace(/DLY/i, 'Daily');
        s = s.replace(/(\d{4})-(\d{4})/, '$1–$2Z');
        return s.trim();
    }

    function isCancellation(notam, translations) {
        if (!notam) return true;
        var type = String(notam.type || '').toUpperCase();
        if (type === 'C') return true;
        var text = String(notam.text || '').toUpperCase();
        if (text.indexOf('NOTAMC') !== -1) return true;
        if (translations && translations.length) {
            for (var i = 0; i < translations.length; i++) {
                var blob = String((translations[i].formattedText || '') + ' ' + (translations[i].simpleText || '')).toUpperCase();
                if (/\bNOTAMC\b/.test(blob) && type === 'C') return true;
            }
        }
        return false;
    }

    function extractNotams(payload) {
        var features = [];
        try {
            if (payload && payload.data && payload.data.data && Array.isArray(payload.data.data.geojson)) {
                features = payload.data.data.geojson;
            } else if (payload && payload.data && Array.isArray(payload.data.geojson)) {
                features = payload.data.geojson;
            } else if (payload && Array.isArray(payload.geojson)) {
                features = payload.geojson;
            } else if (Array.isArray(payload)) {
                features = payload;
            }
        } catch (e) {
            features = [];
        }
        if (!Array.isArray(features)) features = [];

        var now = Date.now();
        var list = [];

        for (var i = 0; i < features.length; i++) {
            var f = features[i];
            var core = f && f.properties && f.properties.coreNOTAMData;
            if (!core || !core.notam) continue;
            var n = core.notam;
            var translations = core.notamTranslation || [];
            if (isCancellation(n, translations)) continue;

            if (n.effectiveEnd) {
                var endMs = new Date(n.effectiveEnd).getTime();
                if (!isNaN(endMs) && endMs <= now) continue;
            }

            var number = n.number || '';
            if (!number && n.series && n.year) {
                number = n.series + '????/' + String(n.year).slice(-2);
            }

            var rawText = n.text || '';
            var sanitizedText = rawText.replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();

            list.push({
                id: n.id || (number + '-' + (n.issued || i)),
                number: number || ('NOTAM ' + (i + 1)),
                text: sanitizedText,
                start: n.effectiveStart || n.issued || '',
                end: n.effectiveEnd || '',
                issued: n.issued || '',
                schedule: formatSchedule(n.schedule),
                location: n.icaoLocation || n.location || locationCode
            });
        }

        list.sort(function (a, b) {
            var aStart = new Date(a.start).getTime();
            var bStart = new Date(b.start).getTime();

            var aHasValidStart = !isNaN(aStart);
            var bHasValidStart = !isNaN(bStart);

            var aActive = (aHasValidStart && aStart <= now) ? 0 : 1;
            var bActive = (bHasValidStart && bStart <= now) ? 0 : 1;

            if (aActive !== bActive) {
                return aActive - bActive;
            }

            if (!aHasValidStart) aStart = Number.MAX_SAFE_INTEGER;
            if (!bHasValidStart) bStart = Number.MAX_SAFE_INTEGER;

            return aStart - bStart;
        });

        return list;
    }

    function stopRotation() {
        if (rotateTimer) {
            clearTimeout(rotateTimer);
            rotateTimer = null;
        }
        var bar = document.getElementById('progress-fill');
        if (bar) {
            bar.classList.remove('running');
            bar.style.animationDuration = '';
        }
    }

    function restartProgress(totalPages, durationMs) {
        var bar = document.getElementById('progress-fill');
        if (!bar) return;
        bar.classList.remove('running');
        void bar.offsetWidth;
        if (totalPages > 1) {
            bar.style.animationDuration = (durationMs / 1000) + 's';
            bar.classList.add('running');
        }
    }

    function startRotation(totalPages, durationMs) {
        stopRotation();
        if (totalPages <= 1) return;

        restartProgress(totalPages, durationMs);

        rotateTimer = setTimeout(function () {
            var total = Math.ceil(notams.length / PAGE_SIZE);
            if (total <= 1) return;
            showPage((currentPage + 1) % total, true);
        }, durationMs);
    }

    function buildDots(count, active) {
        var row = document.getElementById('dot-row');
        row.innerHTML = '';
        if (count <= 1 || count > 14) return;
        for (var i = 0; i < count; i++) {
            var d = document.createElement('span');
            d.className = 'dot' + (i === active ? ' current' : '');
            row.appendChild(d);
        }
    }

    function showEmpty(kind, title, sub) {
        stopRotation();
        document.getElementById('val-counter').textContent = '0 NOTAMs';
        document.getElementById('dot-row').innerHTML = '';
        var wrap = document.getElementById('table-wrap');
        wrap.innerHTML = '';
        var box = document.createElement('div');
        box.className = kind;
        var t = document.createElement('div');
        t.className = kind === 'error-state' ? 'error-title' : (kind === 'loading-state' ? 'loading-title' : 'empty-title');
        t.textContent = title;
        box.appendChild(t);
        if (sub) {
            var s = document.createElement('div');
            s.className = 'empty-sub';
            s.textContent = sub;
            box.appendChild(s);
        }
        wrap.appendChild(box);
    }

    function setupMarquee(track) {
        if (!track) return 0;
        var wrapper = track.parentElement;
        var firstSpan = track.querySelector('.plain-text');
        if (!firstSpan || !wrapper) return 0;

        track.classList.remove('marquee-mode', 'running');
        track.style.animationDuration = '';
        var spans = track.querySelectorAll('.plain-text');
        for (var i = 1; i < spans.length; i++) {
            spans[i].remove();
        }

        var isOverflowingTwoLines = firstSpan.scrollHeight > (firstSpan.clientHeight + 2);

        if (isOverflowingTwoLines) {
            track.classList.add('marquee-mode');

            var naturalWidth = firstSpan.scrollWidth;
            var clone = firstSpan.cloneNode(true);
            track.appendChild(clone);

            var travelSec = Math.max(10, Math.round(naturalWidth / 40));
            track.style.animationDuration = travelSec + 's';
            track.classList.add('running');

            return (travelSec * 1000) + INITIAL_PAUSE_MS;
        }
        return 0;
    }

    function populatePageTable(pageItems) {
        var wrap = document.getElementById('table-wrap');
        wrap.innerHTML = '';

        var table = document.createElement('table');
        table.className = 'notam-table';
        table.id = 'notam-table';

        var thead = document.createElement('thead');
        var hr = document.createElement('tr');
        var headers = [
            { cls: 'col-id',    label: 'NOTAM #' },
            { cls: 'col-start', label: 'Effective Start' },
            { cls: 'col-end',   label: 'Effective End' },
            { cls: 'col-text',  label: 'Details / Text' }
        ];

        for (var h = 0; h < headers.length; h++) {
            var th = document.createElement('th');
            th.className = headers[h].cls;
            th.textContent = headers[h].label;
            hr.appendChild(th);
        }

        thead.appendChild(hr);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');

        for (var i = 0; i < pageItems.length; i++) {
            var item = pageItems[i];
            var row = document.createElement('tr');
            row.className = 'item-row';

            var tdId = document.createElement('td');
            tdId.className = 'col-id';
            var idContainer = document.createElement('div');
            idContainer.className = 'id-container';

            var numSpan = document.createElement('span');
            numSpan.className = 'notam-num';
            numSpan.textContent = item.number || '——';
            idContainer.appendChild(numSpan);

            var startMs = item.start ? new Date(item.start).getTime() : 0;
            var isFuture = startMs && startMs > Date.now();
            var chip = document.createElement('span');
            if (isFuture) {
                chip.className = 'status-chip status-scheduled';
                chip.textContent = 'SCHEDULED';
            } else {
                chip.className = 'status-chip status-active';
                chip.textContent = 'ACTIVE';
            }
            idContainer.appendChild(chip);
            tdId.appendChild(idContainer);
            row.appendChild(tdId);

            var startFmt = formatEasternTime(item.start);
            var tdStart = document.createElement('td');
            tdStart.className = 'col-start';
            var startBox = document.createElement('div');
            startBox.className = 'when-cell';
            var startDt = document.createElement('span');
            startDt.className = 'when-date-time';
            startDt.innerHTML = startFmt.date + (startFmt.time ? '<span class="when-time-part">' + startFmt.time + '</span>' : '');
            startBox.appendChild(startDt);
            tdStart.appendChild(startBox);
            row.appendChild(tdStart);

            var endFmt = formatEasternTime(item.end);
            var tdEnd = document.createElement('td');
            tdEnd.className = 'col-end';
            var endBox = document.createElement('div');
            endBox.className = 'when-cell';
            var endDt = document.createElement('span');
            endDt.className = 'when-date-time';
            endDt.innerHTML = endFmt.date + (endFmt.time ? '<span class="when-time-part">' + endFmt.time + '</span>' : '');
            endBox.appendChild(endDt);

            if (item.schedule) {
                var sch = document.createElement('span');
                sch.className = 'when-sched';
                sch.textContent = item.schedule;
                endBox.appendChild(sch);
            }

            tdEnd.appendChild(endBox);
            row.appendChild(tdEnd);

            var tdText = document.createElement('td');
            tdText.className = 'col-text';
            var scrollWrapper = document.createElement('div');
            scrollWrapper.className = 'text-scroll-wrapper';
            var track = document.createElement('div');
            track.className = 'marquee-track';
            var p = document.createElement('span');
            p.className = 'plain-text';
            p.textContent = item.text || '—';
            track.appendChild(p);
            scrollWrapper.appendChild(track);
            tdText.appendChild(scrollWrapper);
            row.appendChild(tdText);

            tbody.appendChild(row);
        }

        for (var k = pageItems.length; k < PAGE_SIZE; k++) {
            var emptyRow = document.createElement('tr');
            emptyRow.className = 'empty-filler-row';
            var tdEmpty = document.createElement('td');
            tdEmpty.colSpan = 4;
            tdEmpty.innerHTML = '&nbsp;';
            emptyRow.appendChild(tdEmpty);
            tbody.appendChild(emptyRow);
        }

        table.appendChild(tbody);
        wrap.appendChild(table);
    }

    function updateHeader(pageIndex, totalPages) {
        document.getElementById('val-location').textContent = locationCode;
        var totalMessages = notams.length;
        document.getElementById('val-counter').textContent =
            'PAGE ' + (pageIndex + 1) + ' / ' + totalPages + ' (' + totalMessages + ' MESSAGES)';

        if (fetchedAtIso) {
            document.getElementById('val-fetched').textContent = formatFetched(fetchedAtIso);
        }

        buildDots(totalPages, pageIndex);
    }

    function showPage(pageIndex, animate) {
        if (!notams.length) return;
        var totalPages = Math.ceil(notams.length / PAGE_SIZE);
        currentPage = ((pageIndex % totalPages) + totalPages) % totalPages;

        var startIdx = currentPage * PAGE_SIZE;
        var pageItems = notams.slice(startIdx, startIdx + PAGE_SIZE);

        var applyContent = function() {
            populatePageTable(pageItems);
            updateHeader(currentPage, totalPages);

            setTimeout(function() {
                var tracks = document.querySelectorAll('.marquee-track');
                var maxMarqueeMs = 0;

                for (var i = 0; i < tracks.length; i++) {
                    var ms = setupMarquee(tracks[i]);
                    if (ms > maxMarqueeMs) {
                        maxMarqueeMs = ms;
                    }
                }

                var pageDisplayMs = Math.max(DEFAULT_ROTATE_MS, maxMarqueeMs);
                startRotation(totalPages, pageDisplayMs);
            }, 60);
        };

        if (animate) {
            var existing = document.getElementById('notam-table');
            if (existing) existing.classList.add('fade');
            if (fadeTimer) clearTimeout(fadeTimer);
            fadeTimer = setTimeout(applyContent, 260);
        } else {
            applyContent();
        }
    }

    function handlePayload(payload) {
        if (!payload || payload.ok === false) {
            if (notams.length) return;
            lastPayloadOk = false;
            document.getElementById('val-fetched').textContent = 'Feed unavailable';
            showEmpty('error-state', 'NOTAM FEED OFFLINE', 'Unable to reach FAA NMS. Retrying with dashboard refresh.');
            return;
        }

        lastPayloadOk = true;
        locationCode = payload.location || 'KNEL';
        fetchedAtIso = payload.fetchedAt || new Date().toISOString();
        document.getElementById('val-location').textContent = locationCode;
        document.getElementById('val-fetched').textContent = formatFetched(fetchedAtIso);

        notams = extractNotams(payload);

        if (!notams.length) {
            showEmpty('empty-state', 'NO ACTIVE NOTAMs', 'No current or upcoming NOTAMs for ' + locationCode);
            return;
        }

        var totalPages = Math.ceil(notams.length / PAGE_SIZE);
        if (currentPage >= totalPages) currentPage = 0;

        showPage(currentPage, false);
    }

    function checkCachedData() {
        var cached = localStorage.getItem('cached_notam_payload');
        if (!cached) return;
        try {
            var parsed = JSON.parse(cached);
            if (parsed && parsed.data) handlePayload(parsed.data);
        } catch (e) {}
    }

    checkCachedData();
    notifyParent('NOTAM_READY');
    setTimeout(function () { if (!hasDisplayableData()) notifyParent('NOTAM_READY'); }, 150);
    setTimeout(function () { if (!hasDisplayableData()) notifyParent('NOTAM_READY'); }, 600);

    setTimeout(function () {
        if (hasDisplayableData()) return;
        notifyParent('NOTAM_REQUEST');
        var label = document.getElementById('val-fetched');
        if (label) label.textContent = 'Waiting for parent feed…';
    }, 2500);

    setTimeout(function () {
        if (hasDisplayableData()) return;
        notifyParent('NOTAM_REQUEST');
        showEmpty(
            'error-state',
            'NOTAM FEED OFFLINE',
            'No data received from dashboard. Retrying automatically.'
        );
    }, 8000);
</script>
</body>
</html>
