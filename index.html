<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Non-Apple Manifest -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/Icons/logo180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/Icons/logo180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/Icons/logo152.png">
  
  <title>LKE Aviation Dashboard</title>
  <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background-color: #0b0f19;
        color: #f8fafc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        box-sizing: border-box;
    }
 
    .dashboard-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        height: 100dvh;
        padding: 10px;
        box-sizing: border-box;
        gap: 8px;
    }
 
    .pane {
        width: 100%;
        height: 100%;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        border: 1px solid #334155;
        background-color: #1e293b;
        min-height: 0;
    }
 
    /* Top METAR Panel */
    .metar-pane {
        height: 165px;
        flex-shrink: 0;
        background-color: #e9ecef;
    }

    /* Horizontal TAF strip directly under METAR — compact light theme */
    .taf-pane {
        height: 118px;
        min-height: 118px;
        flex-shrink: 0;
        background-color: #e9ecef;
        /* No height transition — animated resize was feeding a measure/grow loop */
    }
 
    /* Lower Content Grid: Radar | Lightning/Traffic */
    .main-content-grid {
        flex: 1 1 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr;
        gap: 10px;
        min-height: 0;
    }
 
    iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
 
    /* Mobile / Portrait: still fill 100% of the viewport (no page scroll) */
    @media screen and (max-width: 1100px), screen and (max-aspect-ratio: 1/1), (orientation: portrait) {
        html, body {
            overflow: hidden !important;
            height: 100% !important;
            height: 100dvh !important;
        }

        .dashboard-container {
            height: 100% !important;
            height: 100dvh !important;
            overflow: hidden !important;
            padding: 6px;
            gap: 6px;
        }

        .metar-pane {
            height: 185px !important;
            flex-shrink: 0;
        }

        .taf-pane {
            /* Base mobile height; may be raised once via postMessage if content needs more room */
            height: 130px;
            min-height: 130px;
            flex-shrink: 0;
        }
 
        .main-content-grid {
            display: flex;
            flex-direction: column;
            flex: 1 1 0;
            min-height: 0;
            gap: 6px;
        }

        .main-content-grid > .pane {
            flex: 1 1 0;
            height: auto;
            min-height: 0;
        }
    }
</style>
 </head>
 <body>
  <div class="dashboard-container">
   <!-- Top METAR Panel -->
   <div class="pane metar-pane">
    <iframe id="metar-frame" src="metar.html" title="METAR Display"></iframe>
   </div>

   <!-- Horizontal TAF Strip (under METAR) -->
   <div class="pane taf-pane">
    <iframe id="taf-frame" src="taf.html" title="Hourly TAF Forecast"></iframe>
   </div>

   <!-- Main Viewports: Radar | Lightning & Traffic -->
   <div class="main-content-grid">
    <div class="pane">
        <iframe src="https://radar.weather.gov/?settings=v1_eyJhZ2VuZGEiOnsiaWQiOiJuYXRpb25hbCIsImNlbnRlciI6Wy03NC43MjUsNDAuMTY1XSwibG9jYXRpb24iOm51bGwsInpvb20iOjcuODU4MjEyNTg3NTk4NzUzLCJsYXllciI6ImJyZWZfcWNkIn0sImFuaW1hdGluZyI6dHJ1ZSwiYmFzZSI6InN0YW5kYXJkIiwiYXJ0Y2MiOmZhbHNlLCJjb3VudHkiOmZhbHNlLCJjd2EiOmZhbHNlLCJyZmMiOmZhbHNlLCJzdGF0ZSI6dHJ1ZSwibWVudSI6dHJ1ZSwic2hvcnRGdXNlZE9ubHkiOnRydWUsIm9wYWNpdHkiOnsiYWxlcnRzIjowLjgsImxvY2FsIjowLjYsImxvY2FsU3RhdGlvbnMiOjAuOCwibmF0aW9uYWwiOjAuODl9fQ%3D%3D" title="NOAA Radar Viewport"></iframe>
    </div>
    <div class="pane">
     <iframe src="lightning.html" title="Lightning &amp; Traffic Viewport"></iframe>
    </div>
   </div>
  </div>

  <script>
    // Single Centralized Fetch (Called on Load and Every 5 Minutes)
    async function fetchWeatherOnce() {
        const targetUrl = 'https://metar-worker.nawcadlkepmt.workers.dev/';
        const apiKey = 'hkY^h&%yu787@$HdfDG';

        try {
            const response = await fetch(targetUrl, { 
                cache: 'no-store',
                headers: { 'X-API-Key': apiKey }
            });
            if (!response.ok) throw new Error("HTTP " + response.status);
            const payload = await response.json();
            
            // Save payload to local storage
            localStorage.setItem('cached_weather_payload', JSON.stringify({
                timestamp: Date.now(),
                data: payload
            }));

            // Broadcast payload to child iframes (metar.html & taf.html)
            broadcastWeatherData(payload);
        } catch (err) {
            console.error("Central fetch failed:", err);
            broadcastWeatherData(null);
        }
    }

    function broadcastWeatherData(payload) {
        const metarFrame = document.getElementById('metar-frame');
        const tafFrame = document.getElementById('taf-frame');

        if (metarFrame && metarFrame.contentWindow) {
            metarFrame.contentWindow.postMessage({ type: 'WEATHER_DATA', payload }, '*');
        }
        if (tafFrame && tafFrame.contentWindow) {
            tafFrame.contentWindow.postMessage({ type: 'WEATHER_DATA', payload }, '*');
        }
    }

    /* Let the TAF strip request more vertical space when card content would clip.
       Guarded so we only apply on mobile and only when the value actually changes. */
    var _appliedTafHeight = 0;
    window.addEventListener('message', function (event) {
        if (!event.data || event.data.type !== 'TAF_HEIGHT') return;
        var isMobile = window.matchMedia(
            '(max-width: 1100px), (max-aspect-ratio: 1/1), (orientation: portrait)'
        ).matches;
        if (!isMobile) return;

        var pane = document.querySelector('.taf-pane');
        if (!pane) return;
        var needed = Math.ceil(Number(event.data.height) || 0);
        if (needed < 100) return;

        /* Cap so radar/lightning still get room on short phones */
        var maxH = Math.floor(window.innerHeight * 0.28);
        var h = Math.min(Math.max(needed, 118), maxH);

        if (Math.abs(h - _appliedTafHeight) < 3) return;
        _appliedTafHeight = h;
        pane.style.height = h + 'px';
        pane.style.minHeight = h + 'px';
    });

    // Initial fetch when page loads
    window.addEventListener('DOMContentLoaded', () => {
        fetchWeatherOnce();
        
        // Refresh weather data every 5 minutes (300,000 ms)
        setInterval(fetchWeatherOnce, 300000);
    });

    (function setupIdleRefresh() {
      const IDLE_TIMEOUT = 5 * 60 * 1000;
      let hiddenStartTime = null;

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          hiddenStartTime = Date.now();
        } else {
          if (hiddenStartTime && (Date.now() - hiddenStartTime >= IDLE_TIMEOUT)) {
            window.location.reload();
          }
          hiddenStartTime = null;
        }
      });
    })();
  </script>
 </body>
</html>
