<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="/Icons/logo180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/Icons/logo152.png">
  
  <title>LKE Aviation Dashboard</title>
  <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0b0f19;
        color: #f8fafc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        box-sizing: border-box;
    }
 
    .dashboard-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 12px;
        box-sizing: border-box;
        gap: 12px;
    }
 
    .pane {
        width: 100%;
        height: 100%;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        border: 1px solid #334155;
        background-color: #1e293b;
    }
 
    /* Top METAR Panel (Landscape Default) */
    .metar-pane {
        height: 175px;
        flex-shrink: 0;
        background-color: #e9ecef;
        transition: height 0.3s ease;
    }
 
    /* Lower Content Grid: TAF on left, Radar in middle, Flight tracking on right */
    .main-content-grid {
        flex: 1;
        display: grid;
        grid-template-columns: 840px 640px 1fr;
        grid-template-rows: 1fr;
        gap: 12px;
        min-height: 0;
    }
 
    iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
 
    /* Mobile & Narrow Breakpoints: Vertical stack with page scrolling */
    @media screen and (max-width: 1550px), screen and (max-aspect-ratio: 1/1), (orientation: portrait) {
        html, body {
            overflow: auto !important;
            height: auto !important;
        }

        .dashboard-container {
            height: auto !important;
            overflow: visible !important;
        }

        .metar-pane {
            height: 180px !important;
            flex-shrink: 0;
        }
 
        .main-content-grid {
            display: flex;
            flex-direction: column;
            height: auto !important;
        }

        .pane {
            height: 450px;
            flex-shrink: 0;
        }
    }
</style>
 </head>
 <body>
  <div class="dashboard-container">
   <!-- Top METAR Panel -->
   <div class="pane metar-pane">
    <iframe id="metar-frame" src="metar.html" title="METAR Display"></iframe>
   </div>
   <!-- Main Viewports Grid -->
   <div class="main-content-grid">
    <!-- Left Column: Full-Height TAF Panel -->
    <div class="pane">
        <iframe id="taf-frame" src="taf.html" title="KWRI TAF Forecast Table"></iframe>
    </div>
    <!-- Middle Column: Radar Viewport -->
    <div class="pane">
        <iframe src="https://radar.weather.gov/?settings=v1_eyJhZ2VuZGEiOnsiaWQiOiJuYXRpb25hbCIsImNlbnRlciI6Wy03NC43MjUsNDAuMTY1XSwibG9jYXRpb24iOm51bGwsInpvb20iOjcuODU4MjEyNTg3NTk4NzUzLCJsYXllciI6ImJyZWZfcWNkIn0sImFuaW1hdGluZyI6dHJ1ZSwiYmFzZSI6InN0YW5kYXJkIiwiYXJ0Y2MiOmZhbHNlLCJjb3VudHkiOmZhbHNlLCJjd2EiOmZhbHNlLCJyZmMiOmZhbHNlLCJzdGF0ZSI6dHJ1ZSwibWVudSI6dHJ1ZSwic2hvcnRGdXNlZE9ubHkiOnRydWUsIm9wYWNpdHkiOnsiYWxlcnRzIjowLjgsImxvY2FsIjowLjYsImxvY2FsU3RhdGlvbnMiOjAuOCwibmF0aW9uYWwiOjAuODl9fQ%3D%3D" title="NOAA Radar Viewport"></iframe>
    </div>
    <!-- Right Column: Lightning & Traffic Pane -->
    <div class="pane">
     <iframe src="lightning.html" title="Lightning &amp; Traffic Viewport"></iframe>
    </div>
   </div>
  </div>

  <script>
    // Single Centralized Fetch (Called on Load and Every 5 Minutes)
    async function fetchWeatherOnce() {
        const targetUrl = 'https://metar-worker.nawcadlkepmt.workers.dev/';
        const apiKey = 'hkY^h&%yu787@$HdfDG';

        try {
            const response = await fetch(targetUrl, { 
                cache: 'no-store',
                headers: { 'X-API-Key': apiKey }
            });
            if (!response.ok) throw new Error("HTTP " + response.status);
            const payload = await response.json();
            
            // Save payload to local storage
            localStorage.setItem('cached_weather_payload', JSON.stringify({
                timestamp: Date.now(),
                data: payload
            }));

            // Broadcast payload to child iframes (metar.html & taf.html)
            broadcastWeatherData(payload);
        } catch (err) {
            console.error("Central fetch failed:", err);
            broadcastWeatherData(null);
        }
    }

    function broadcastWeatherData(payload) {
        const metarFrame = document.getElementById('metar-frame');
        const tafFrame = document.getElementById('taf-frame');

        if (metarFrame && metarFrame.contentWindow) {
            metarFrame.contentWindow.postMessage({ type: 'WEATHER_DATA', payload }, '*');
        }
        if (tafFrame && tafFrame.contentWindow) {
            tafFrame.contentWindow.postMessage({ type: 'WEATHER_DATA', payload }, '*');
        }
    }

    // Initial fetch when page loads
    window.addEventListener('DOMContentLoaded', () => {
        fetchWeatherOnce();
        
        // Refresh weather data every 5 minutes (300,000 ms)
        setInterval(fetchWeatherOnce, 300000);
    });

    (function setupIdleRefresh() {
      const IDLE_TIMEOUT = 5 * 60 * 1000;
      let hiddenStartTime = null;

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          hiddenStartTime = Date.now();
        } else {
          if (hiddenStartTime && (Date.now() - hiddenStartTime >= IDLE_TIMEOUT)) {
            window.location.reload();
          }
          hiddenStartTime = null;
        }
      });
    })();
  </script>
 </body>
</html>
